[package]
name = "cachepin"
version = "0.2.0"
edition = "2021"
description = "Diagnose LLM prompt-cache misses, normalize tool and schema order, and route requests to inference backends with a Rust CLI, proxy, and MCP server."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["llm", "prompt-cache", "kv-cache", "multi-agent", "proxy"]
categories = ["network-programming", "algorithms", "command-line-utilities"]

[lib]
name = "cachepin"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cachepin"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
