[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racecurve-tools"
version = "0.2.0"
requires-python = ">=3.10"
description = "Replay delayed backup requests from paired timings or cancellation-censored traces."
readme = "README.md"
license = {file = "LICENSE"}
dependencies = []

[project.urls]
Demo = "https://huggingface.co/spaces/pgg-engineering/racecurve"

[project.scripts]
racecurve-bounds = "racecurve_tools.bounds:main"
racecurve-otlp = "racecurve_tools.otlp:main"
racecurve-demo = "racecurve_tools.demo:main"

[tool.setuptools]
packages = ["racecurve_tools"]

[tool.setuptools.package-data]
racecurve_tools = ["loopback.csv"]
