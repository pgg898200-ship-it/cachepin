name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build zero-dependency release binary & C-ABI library
        run: |
          RUSTFLAGS="-D warnings" cargo build --release --target ${{ matrix.target }}
      - name: Package release archive
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cachepin dist/
          for lib in target/${{ matrix.target }}/release/libcachepin.*; do
            [ -f "$lib" ] && cp "$lib" dist/ || true
          done
          cp LICENSE README.md SKILL.md dist/
          tar -czf "cachepin-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: cachepin-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum cachepin-*.tar.gz > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/cachepin-*.tar.gz
            artifacts/SHA256SUMS
