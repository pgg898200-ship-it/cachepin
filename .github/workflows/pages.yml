name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/**"
      - "benchmarks/results.json"
      - "llms.txt"
      - "SKILL.md"
      - "server.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble Pages bundle with live AEO & visual assets
        run: |
          mkdir -p _site/assets
          cp -r site/* _site/
          if [ -d docs/assets ]; then
            cp -r docs/assets/* _site/assets/
          fi
          cp llms.txt SKILL.md server.json _site/
          cp benchmarks/results.json _site/results.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
