name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-x86_64:
    name: Verify x86_64 (AVX2 + Controls + Adversarial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify zero-dependency build, tests, adversarial suite & benchmarks
        run: ./scripts/verify.sh
      - name: Validate Official MCP Registry manifest (server.json)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          ./mcp-publisher validate
          rm -f mcp-publisher

  verify-arm64-neon:
    name: Verify aarch64 (Native ARM64 NEON)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run full Rust test suite on native ARM64 NEON
        run: |
          RUSTFLAGS="-D warnings" cargo test --release
          RUSTFLAGS="-D warnings" cargo build --release
          ./target/release/cachepin --version | tee /tmp/ver.txt
          grep -q "simd: neon" /tmp/ver.txt
