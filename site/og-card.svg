<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">CachePin · A prompt prefix comparison</title>
  <desc id="desc">Two example requests share a runbook but list their tools in different orders. Sorting them restores 1,099 of 1,113 estimated matching tokens in a local replay.</desc>
  <defs>
    <pattern id="paper" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#eeeada"/>
      <path d="M-2 2L2-2 M0 10L10 0 M8 12L12 8" stroke="#c5c0ab" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f8f5eb"/>
  <g fill="#222b22">
    <text x="65" y="84" font-family="Georgia,serif" font-size="46" font-weight="bold">CachePin</text>
    <path d="M65 108H1135" stroke="#b5ad94" stroke-width="2"/>
    <text x="65" y="226" font-family="Georgia,serif" font-size="76">Where do your prompts <tspan fill="#245b44" font-style="italic">split?</tspan></text>
    <text x="67" y="285" font-family="sans-serif" font-size="29">Same runbook. Same tools. Different tool order.</text>
    <g font-family="monospace" font-size="27">
      <text x="68" y="374">Before</text>
      <rect x="224" y="345" width="670" height="36" fill="url(#paper)" stroke="#b5ad94" stroke-width="2"/>
      <text x="1132" y="374" text-anchor="end">0 / 1,113</text>
      <text x="68" y="443">After</text>
      <rect x="224" y="414" width="670" height="36" fill="url(#paper)" stroke="#b5ad94" stroke-width="2"/>
      <rect x="224" y="414" width="661.57" height="36" fill="#245b44"/>
      <text x="1132" y="443" text-anchor="end">1,099 / 1,113</text>
    </g>
    <text x="68" y="513" font-family="sans-serif" font-size="24" fill="#536050">Matching prompt tokens estimated by the CLI on the bundled example pair.</text>
    <path d="M65 553H1135" stroke="#b5ad94" stroke-width="2"/>
    <text x="68" y="593" font-family="monospace" font-size="20" fill="#536050">cachepin diff a.json b.json --mode json</text>
  </g>
</svg>
